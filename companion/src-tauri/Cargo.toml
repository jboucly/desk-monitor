[package]
name = "desk-monitor-companion"
version = "0.1.0"
description = "Desk Monitor PC companion: sends metrics to the desk screen and runs its shortcuts"
edition = "2021"
rust-version = "1.80"

[lib]
name = "desk_monitor_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
sysinfo = "0.39"
enigo = "0.6"
open = "5"
hostname = "0.4"
log = "0.4"
env_logger = "0.11"
dns-lookup = "4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSPanel"] }

[target.'cfg(windows)'.dependencies]
nvml-wrapper = "0.13"
